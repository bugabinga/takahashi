name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # Offline core: pure Zig, no system libraries — runs on every platform.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) arch=x86_64-linux ;;
            macOS) arch=aarch64-macos ;;
          esac
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "zig-x86_64-windows-$env:ZIG_VERSION"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$dir.zip" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath $HOME\zig
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME\zig\$dir"
      - name: Unit and integration tests (offline, headless)
        run: zig build test
      - name: Formatting gate
        run: zig build check

  # Full build including the window form: needs FreeType/HarfBuzz plus the
  # platform window/graphics libraries. This is where the per-OS linking in
  # build.zig is exercised on a real machine (see docs/cross-platform.md).
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) arch=x86_64-linux ;;
            macOS) arch=aarch64-macos ;;
          esac
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev \
            libfreetype-dev libharfbuzz-dev
      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install freetype harfbuzz
      - name: Build the app (all output forms)
        run: zig build
