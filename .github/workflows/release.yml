name: Release

# Semi-automatic: pushing a version tag (e.g. v0.1.0) builds each platform and
# opens a *draft* GitHub release with the archives attached. A human reviews and
# publishes it. Text is vendored (stb_truetype), so no text library is
# installed; only Linux needs the window/graphics -dev packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            arch: x86_64-linux
          - os: macos-latest
            name: macos-aarch64
            arch: aarch64-macos
          - os: windows-latest
            name: windows-x86_64
            arch: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.arch }}-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "zig-x86_64-windows-$env:ZIG_VERSION"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$dir.zip" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath $HOME\zig
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME\zig\$dir"
      - name: Install window libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev
      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir="takahashi-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          cp zig-out/bin/takahashi "dist/$dir/"
          cp README.md SPEC.md LICENSE THIRD-PARTY-NOTICES.md "dist/$dir/"
          tar -C dist -czf "$dir.tar.gz" "$dir"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "takahashi-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$dir" | Out-Null
          Copy-Item zig-out/bin/takahashi.exe "dist/$dir/"
          Copy-Item README.md,SPEC.md,LICENSE,THIRD-PARTY-NOTICES.md "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: takahashi-${{ matrix.name }}
          path: |
            takahashi-*.tar.gz
            takahashi-*.zip

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
