name: Release

# Semi-automatic: pushing a version tag (e.g. v0.1.0) builds each platform and
# opens a *draft* GitHub release with the archives attached. A human reviews and
# publishes it. Windows is not built yet (see docs/cross-platform.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            arch: x86_64-linux
          - os: macos-latest
            name: macos-aarch64
            arch: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.arch }}-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev \
            libfreetype-dev libharfbuzz-dev
      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install freetype harfbuzz
      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
      - name: Package
        run: |
          mkdir -p "dist/takahashi-${{ github.ref_name }}-${{ matrix.name }}"
          cp zig-out/bin/takahashi "dist/takahashi-${{ github.ref_name }}-${{ matrix.name }}/"
          cp README.md SPEC.md LICENSE THIRD-PARTY-NOTICES.md \
            "dist/takahashi-${{ github.ref_name }}-${{ matrix.name }}/"
          tar -C dist -czf "takahashi-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" \
            "takahashi-${{ github.ref_name }}-${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: takahashi-${{ matrix.name }}
          path: takahashi-*.tar.gz

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
