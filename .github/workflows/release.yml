name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Match tag and package versions
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          version=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          [[ "${GITHUB_REF_NAME#v}" == "$version" || "${GITHUB_REF_NAME#v}" == "$version"-* ]]

  build:
    name: build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: ubuntu-22.04-arm
            name: linux-aarch64
          - os: macos-15-intel
            name: macos-x86_64
          - os: macos-15
            name: macos-aarch64
          - os: windows-2025
            name: windows-x86_64
          - os: windows-2025
            name: windows-aarch64
            target: aarch64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2.2.2
      - name: Install window libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxext-dev
      - name: Test
        run: zig build test
      - name: Check formatting
        run: zig build check
      - name: Build native
        if: matrix.target == null
        run: zig build -Doptimize=ReleaseFast
      - name: Build target
        if: matrix.target != null
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir="taka-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$dir"
          cp zig-out/bin/taka LICENSE THIRD-PARTY-NOTICES.md "dist/$dir/"
          tar -C dist -czf "$dir.tar.gz" "$dir"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "taka-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$dir" | Out-Null
          Copy-Item zig-out/bin/taka.exe,LICENSE,THIRD-PARTY-NOTICES.md "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            taka-*.tar.gz
            taka-*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum taka-* > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(--draft --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
